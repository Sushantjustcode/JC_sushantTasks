<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <section class="hero h-screen w-screen flex justify-center items-center">
      <div class="cardContainer flex justify-center items-center">
        <div
          class="card flex flex-col w-80 p-4 bg-amber-100 rounded-xl rounded-xltransition-all duration-700 ease-in-out hover:-translate-y-2 hover:shadow-xl hover:rounded-none"
        >
          <div
            class="cardTitle text-xl font-bold mb-3 text-center rounded-xl transition-all duration-700 ease-in-out hover:-translate-y-2 hover:shadow-xl hover:bg-gray-100"
          >
            Sample Card
          </div>
          <div
            class="cardImg m-3 transition-all duration-700 ease-in-out overflow-hidden hover:-translate-y-2 hover:shadow-xl"
          >
            <img
              class="w-full h-48 object-cover rounded-lg"
              src="download.jpeg"
              alt="sample image "
            />
          </div>
          <div
            class="cardDis leading-relaxed text-black-600 p-2 rounded-xl transition-all duration-700 ease-in-out hover:-translate-y-2 hover:shadow-xl hover:bg-gray-100"
          >
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Nesciunt,
            perspiciatis?
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
