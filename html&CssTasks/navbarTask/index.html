<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>navbartask</title>
    <link rel="stylesheet" href="src/index.css" />
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="logo">
          <a href="https://jcsoftwaresolution.com/"
            ><img src="/download.jpeg" alt="logo" id="logo"
          /></a>
        </div>
        <div class="navlinks">
          <ul>
            <li class="homeMenu">
              <a id="homelink" href="#home">Home</a>
              <div class="homeHover">
                <a href="#">Link 1</a>
                <a href="#">Link 2</a>
                <a href="#">Link 3</a>
              </div>
            </li>
            <li><a href="#about">About</a></li>
            <li><a href="#services">services</a></li>
            <li><a href="#contacts">Contact</a></li>
          </ul>
        </div>
      </div>
    </header>

    <section class="hero" id="home">
      <div class="left">
        <div class="container">
          <div class="formsection">
            <h2>Register</h2>

            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.</p>

            <form>
              <div class="row">
                <div class="inputbox">
                  <label>First Name</label>
                  <input type="text" placeholder="e.g. John" />
                  <img class="Icon" src="/user.png" alt="usernameImage" />
                </div>

                <div class="inputbox">
                  <label>Last Name</label>
                  <input type="text" placeholder="e.g. Doe" />
                  <img class="Icon" src="/user.png" alt="usernameImage" />
                </div>
              </div>

              <div class="inputbox">
                <label>Email Address</label>
                <input type="email" placeholder="john@email.com" />
                <img class="Icon" src="/mail.png" alt="usernameImage" />
              </div>

              <div class="row">
                <div class="inputbox">
                  <label>Phone Number</label>
                  <input type="text" placeholder="+00 0000 000000" />
                  <img class="Icon" src="/telephone.png" alt="usernameImage" />
                </div>

                <div class="inputbox">
                  <label>Website</label>
                  <input type="text" placeholder="https://example.com" />
                  <img class="Icon" src="/link.png" alt="usernameImage" />
                </div>
              </div>

              <div class="row">
                <div class="inputbox">
                  <label>Password</label>
                  <input type="password" />
                  <img class="Icon" src="/padlock.png" alt="usernameImage" />
                </div>

                <div class="inputbox">
                  <label>Confirm Password</label>
                  <input type="password" />
                  <img class="Icon" src="/padlock.png" alt="usernameImage" />
                </div>
              </div>

              <div class="checkbox">
                <input type="checkbox" id="check" />

                <label for="check">
                  Creating an account means you're okay with our Terms &
                  Conditions and Privacy Policy.
                </label>
              </div>

              <button type="submit">Register</button>
            </form>
          </div>
        </div>
      </div>

      <div class="right">
        <img src="659791543481784d133ec094_1704431956621.jpg" alt="image" />
      </div>
    </section>

    <section id="about" class="sampleSection">
      <h1>its a sample section</h1>
    </section>

    <section id="services" class="sampleSection">
      <h1>its a sample section</h1>
    </section>

    <footer class="sampleFooter" id="contacts"><h1>ITS A FOOTER</h1></footer>
    >
  </body>
</html>
