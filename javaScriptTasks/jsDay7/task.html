<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Logic Practice</title>
    <link rel="stylesheet" href="src/task.css" />
  </head>
  <body>
    <h1>JavaScript Logic Practice</h1>

    <!-- Palindrome -->
    <!-- <section>
      <h2>Palindrome number Checker</h2>
      <input type="number" id="palindromeInput" placeholder="Enter a number" />

      <p id="palindromeResult"></p>

    <section>
      <h2>Palindrome Checker</h2>

      <input type="text" id="palindromeStringInput" placeholder="Enter a string" />

      <button id="palindromeStringBtn">Check Palindrome</button>

      <p id="palindromeStringResult"></p>
    </section>

    <!-- Odd Even -->
    <section>
      <h2>Separate Odd and Even</h2>

      <input
        type="text"
        id="arrayInput"
        placeholder="Example: 1,2,3,4,5 (use comma)"
      />

      <button id="oddEvenBtn">Separate</button>

      <p id="oddEvenResult"></p>
    </section>

    <!-- Digit Calculation -->
    <section>
      <h2>Calculate Digits</h2>

      <input type="number" id="digitInput" placeholder="Enter a number" />

      <button id="digitBtn">Calculate</button>

      <p id="digitResult"></p>
    </section>


    <!-- Sorting -->
    <section>
      <h2>Sort Array</h2>

      <input
        type="text"
        id="sortInput"
        placeholder="Example: 5,2,8,1,3 (use comma)"
      />

      <button id="sortBtn">Sort</button>

      <p id="sortResult"></p>
    </section>

    <script src="src/task.js"></script>
  </body>
</html>
